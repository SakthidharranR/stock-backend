# Local microservices mimic — add services as you build them.
services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-postgres
    environment:
      POSTGRES_USER: stockapp
      POSTGRES_PASSWORD: stockapp_dev
      POSTGRES_DB: stockapp
    ports:
      - "5433:5432"  # 5433 on host — Windows Postgres often uses 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockapp -d stockapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
    container_name: stock-identity
    ports:
      - "8081:8081"
    env_file:
      - ./services/identity/.env
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://stockapp:stockapp_dev@postgres:5432/stockapp?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DEV_AUTH_BYPASS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  market:
    build:
      context: ./services/market
      dockerfile: Dockerfile
    container_name: stock-market
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://stockapp:stockapp_dev@postgres:5432/stockapp?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  portfolio:
    build:
      context: ./services/portfolio
      dockerfile: Dockerfile
    container_name: stock-portfolio
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://stockapp:stockapp_dev@postgres:5432/stockapp?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MARKET_SERVICE_URL: http://market:8082
      DEV_AUTH_BYPASS: "true"
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      market:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
